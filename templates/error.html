{% extends "base.html" %}

{% block heading %}Error {{ code }}{% endblock %}
{% block content %}
<div class="sp-card"><p class="mb-3">{{ message }}</p><a class="btn-sp text-decoration-none" href="/dashboard">Back to dashboard</a></div>
{% endblock %}
{% block public %}

{% endblock %}
